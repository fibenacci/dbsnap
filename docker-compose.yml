# Throwaway PostgreSQL for local development and the end-to-end test.
#   docker compose up -d
#   export DATABASE_URL=postgres://dbsnap:dbsnap@localhost:5433/dbsnap
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbsnap
      POSTGRES_PASSWORD: dbsnap
      POSTGRES_DB: dbsnap
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbsnap"]
      interval: 2s
      timeout: 3s
      retries: 20

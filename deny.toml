# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
# Run locally with: cargo deny check

[advisories]
version = 2
# Vulnerabilities fail the build (default). Yanked crates only warn so a
# transient yank doesn't block CI. Nothing is ignored: cargo-deny analyzes the
# real build graph, so optional/never-compiled crates are not flagged.
yanked = "warn"
ignore = []

[licenses]
version = 2
# Permissive + weak-copyleft licenses we accept for dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
# Duplicate dependency versions are common in healthy trees; warn, don't fail.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

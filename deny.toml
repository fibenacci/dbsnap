# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
# Run locally with: cargo deny check

[advisories]
version = 2
# Vulnerabilities fail the build (default). Yanked crates only warn so a
# transient yank doesn't block CI.
yanked = "warn"
ignore = [
    # RSA "Marvin attack" timing side-channel, pulled in transitively by
    # sqlx-mysql (mandatory `rsa` dependency for caching_sha2_password auth).
    # Assessed as NOT exploitable in dbsnap: the advisory concerns RSA
    # *private-key decryption* timing, but dbsnap holds no private key — it only
    # uses the server's *public* key to encrypt its own password during non-TLS
    # MySQL auth (and TLS avoids that path entirely). The decrypting party is the
    # MySQL server, not this tool. No upstream fix exists. See README "Security
    # note" and https://rustsec.org/advisories/RUSTSEC-2023-0071.
    { id = "RUSTSEC-2023-0071", reason = "rsa private-key decryption path not reachable from dbsnap; client only does public-key encryption during MySQL auth" },
]

[licenses]
version = 2
# Permissive + weak-copyleft licenses we accept for dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
# Duplicate dependency versions are common in healthy trees; warn, don't fail.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
